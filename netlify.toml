# Netlify configuration for the Vaylo Sports website.
#
# The site is pre-generated by scripts/deploy-web.cjs into website/, so there is
# no build step on Netlify — it only publishes the output. That is deliberate:
# the generator validates every internal link, every %%TOKEN%% and every footer
# requirement before writing, and the deploy orchestrator runs that validation
# before publishing. A broken page cannot be deployed.
#
#   npm run site:deploy:dry            # generate + verify, no deploy
#   npm run site:deploy                # the above, then publish
#
# Do NOT run `netlify deploy --dir=website` by hand. The generator does
# `rmSync(website)`, so deploying the output of an earlier `npm run site:build`
# can publish a stale site.
#
# SITE_URL is read at generate time and supplies the origin for canonicals, the
# sitemap and robots.txt. Without it they fall back to relative paths, which a
# crawler cannot follow. Set it to the deployed Netlify URL:
#
#   SITE_URL=https://<site>.netlify.app node scripts/gen-website.cjs
#
# Because the Supabase edge gateway and Supabase Storage both serve text content
# as text/plain, hosting the legal documents on either of them produces URLs that
# render as raw source. This file is what makes the policies readable.

[build]
  publish = "website"
  command = ""

# 404.html is generated alongside the pages, so Netlify picks it up as-is.
[[redirects]]
  from = "/*"
  to = "/404.html"
  status = 404

[[headers]]
  for = "/*"
  [headers.values]
  X-Content-Type-Options = "nosniff"
  X-Frame-Options = "SAMEORIGIN"
  Referrer-Policy = "strict-origin-when-cross-origin"

  # Added by the 2026-10-06 security audit (was: no CSP, HSTS or
  # Permissions-Policy at all on this origin).
  #
  # Verified against what the site actually loads — there are no inline
  # scripts and no eval anywhere in the build, so script-src can stay strict:
  #   script-src 'self'        hashed /assets/*.js and the generated site.js
  #   style-src  adds fonts.googleapis.com because index.css @imports it, and
  #              'unsafe-inline' for React style={{…}} attributes and the
  #              srcDoc legal documents (srcdoc iframes inherit this policy)
  #   connect-src names Supabase twice: https for REST/storage/functions,
  #              wss for the realtime channel in useNotifications
  #   media/img add blob: for the object-URL previews (video, photo, CSV)
  #   frame-ancestors 'self' mirrors X-Frame-Options SAMEORIGIN, so this origin
  #              is the only one that may frame it — the srcDoc legal
  #              documents depend on it, and nothing else frames the site
  #
  # HSTS: Netlify already redirects http→https; this makes the browser enforce
  # it. includeSubDomains only reaches subdomains of this host (there are none
  # on *.netlify.app and none on the apex), so it is safe to set here.
  Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; media-src 'self' blob:; frame-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'"
  Strict-Transport-Security = "max-age=31536000; includeSubDomains"
  # Same values the standalone app deploy has always shipped (build-web.cjs),
  # so a visitor moving between the two origins meets one policy. geolocation
  # is (self) because /routines watches GPS; microphone is off because nothing
  # in the app records audio.
  Permissions-Policy = "geolocation=(self), camera=(self), microphone=(), payment=()"
