name: android-debug

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/android-debug.yml"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/android-debug.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # Must satisfy `@capacitor/cli`'s `engines.node` (>=22.0.0). Its bin
          # script checks the version and exits 1 before doing anything, which is
          # how `cap sync` failed instantly on this Node 20 pin.
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets for the native shell
        # `build:native` (base "./") is what ships in the APK; plain `build`
        # (base "/") only works when the page is served from a root path.
        run: npm run build:native

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set up Android SDK
        # v3 is a Node 20 action, which the runner now forces onto Node 24 and
        # which fails for that reason; v4 is the current release.
        uses: android-actions/setup-android@v4

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
