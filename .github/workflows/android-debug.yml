name: android-debug

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/android-debug.yml"
      - "scripts/secret-scan.mjs"
      - ".gitignore"
  pull_request:
    branches: [main]
    paths:
      - "src/**"
      - "supabase/**"
      - "android/**"
      - "package.json"
      - "package-lock.json"
      - "capacitor.config.ts"
      - "vite.config.ts"
      - "vitest.config.ts"
      - "tsconfig*.json"
      - "eslint.config.js"
      - ".github/workflows/android-debug.yml"
      - "scripts/secret-scan.mjs"
      - ".gitignore"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Secret scan
        # Before anything is built, and before the slow Gradle steps, so a
        # committed credential fails in seconds rather than after ten minutes.
        # The Play reviewer password was committed five times before this
        # existed; the working tree had been fixed, so nothing would have
        # flagged it.
        run: npm run secret:scan

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          # Must satisfy `@capacitor/cli`'s `engines.node` (>=22.0.0). Its bin
          # script checks the version and exits 1 before doing anything, which is
          # how `cap sync` failed instantly on this Node 20 pin.
          node-version: "22"
          cache: npm

      - name: Install JS dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Build web assets for the native shell
        # `build:native` is what ships in the APK; the root-absolute base is
        # safe because the native app uses HashRouter for nested routes.
        #
        # CI has no .env (it is git-ignored), and vite.config.ts refuses to
        # build without an sb_publishable_-prefixed key. Repository *variables*
        # supply the real public config when set (making this APK bootable);
        # otherwise inert placeholders let the step verify that the bundle
        # builds — the same trick scripts/build-clone.cjs uses. Either way the
        # guard stays intact; release-quality builds come from
        # scripts/build-apk.sh on a machine with the real config.
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL || 'https://placeholder.supabase.co' }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ vars.VITE_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
        run: npm run build:native

      - name: Sync Capacitor Android assets
        run: npx cap sync android

      - name: Set up Android SDK
        # v3 is a Node 20 action, which the runner now forces onto Node 24 and
        # which fails for that reason; v4 is the current release.
        uses: android-actions/setup-android@v4

      - name: Install the SDK packages the build compiles against
        # setup-android installs cmdline-tools only. The project compiles
        # against SDK 36, which a fresh runner does not carry: Gradle would try
        # to auto-download it and refuse without accepted licences. Install the
        # exact packages and accept the licences explicitly so the build does
        # not depend on what a runner happens to contain.
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses > /dev/null 2>&1 || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools" > /dev/null

      - name: Build debug APK
        working-directory: android
        run: |
          set -o pipefail
          ./gradlew assembleDebug --no-daemon 2>&1 | tee gradle-build.log

      - name: Surface the Gradle failure
        # Job logs require a GitHub sign-in to read; the step summary is the
        # one place this failure can still be diagnosed from the outside.
        if: failure()
        working-directory: android
        run: |
          {
            echo '### Gradle assembleDebug failed'
            if [ -f gradle-build.log ]; then
              echo '```'
              grep -B2 -A30 -m1 -E '^\* What went wrong|FAILURE: Build failed|error:' gradle-build.log || tail -80 gradle-build.log
              echo '```'
            else
              echo 'No Gradle output — the failure was in an earlier step.'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
