<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover is what makes env(safe-area-inset-*) non-zero inside
         the Capacitor shell, so the notch and home indicator are respected. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#05070f" />
    <meta name="color-scheme" content="dark" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />

    <!-- Official Vaylo Sports mark. It sits on the dark shell in /public, so it is
         referenced root-absolute: the app base is "/" for both the web server and
         the Capacitor shell, and a relative href would 404 from a nested route. -->
    <link rel="icon" href="/logo.png" type="image/png" sizes="256x256" />
    <link rel="shortcut icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/logo.png" sizes="180x180" />

    <!-- First-paint colour, inlined so the document itself is the app's
         foundation colour before any stylesheet or module loads. Without it the
         browser paints its default canvas first and the app appears to flash
         black-then-blue on every open — the first of the hard cuts in the boot
         sequence. Same #05070f the splash, the boot veil and the loader use. -->
    <style>
      html,
      body {
        background: #05070f;
        margin: 0;
      }
    </style>

    <title>Vaylo Sports</title>
    <meta name="description" content="Vaylo Sports is an all-sports training log: log sessions, understand load and recovery, find your limiter and prepare for events.">
    <meta name="author" content="Vaylo Sports" />

    <!-- Social preview. Left as-is on purpose: see the note below.

         `website/assets/og.png` (1200x630, the brand's real OG artwork) is committed
         but is NOT deployed — https://vaylo-sports.netlify.app/assets/og.png returns
         404, so both this app and the marketing site point at a social image that the
         live host does not serve yet. The app's own site (vaylo-sports-app.netlify.app)
         has no OG image either, and its `_redirects` SPA fallback answers 200 with
         text/html for any unknown path, so an invented path there is not an image.

         Pointing og:image at a 404 is worse than this placeholder, so this is left
         untouched until the real OG asset is actually deployed. -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/dtMqhUOGRSUvbwKY9Y9bEIMDdp53/social-images/social-1778222524654-5805.webp">

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:site" content="@vaylosports" />
    <meta name="twitter:image" content="https://storage.googleapis.com/gpt-engineer-file-uploads/dtMqhUOGRSUvbwKY9Y9bEIMDdp53/social-images/social-1778222524654-5805.webp">

    <meta property="og:title" content="Vaylo Sports">
  <meta name="twitter:title" content="Vaylo Sports">
  <meta property="og:description" content="An all-sports training log: log sessions, understand load and recovery, find your limiter, prepare for events.">
  <meta name="twitter:description" content="An all-sports training log: log sessions, understand load and recovery, find your limiter, prepare for events.">

</head>
