<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Ad 2 — 6-SECOND STOP (6.0s · 9:16)</title>
<link rel="stylesheet" href="core.css" />
<style>
  .stage { width: 1080px; height: 1920px; }

  /* One number. No app UI, no product tour, no adjectives. Six seconds of
     someone's attention, spent entirely on a single idea. */
  #stage > .core {
    display: grid;
    justify-items: center;
    gap: 0;
    z-index: 3;
  }

  #big {
    font-size: 700px;
    line-height: .8;
    text-align: center;
  }
  #zero {
    font-size: 700px;
    line-height: .8;
    color: hsl(var(--foreground) / .18);
  }

  .punch {
    position: relative;
    display: grid;
    place-items: center;
  }
  .punch::before {
    content: '';
    position: absolute;
    width: 620px;
    height: 620px;
    border-radius: 50%;
    background: radial-gradient(circle, hsla(272 84% 62% / .30), transparent 68%);
    filter: blur(18px);
  }

  #claim {
    font-size: 84px;
    line-height: .98;
    text-align: center;
    padding: 0 130px;
    margin-top: 90px;
  }
  #claim .neg { color: hsl(var(--muted-foreground)); }

  #mark {
    font-family: 'Space Grotesk', sans-serif;
    font-weight: 700;
    font-size: 74px;
    letter-spacing: .30em;
    text-indent: .30em;
    margin-top: 170px;
  }
  #rule {
    width: 190px;
    height: 6px;
    border-radius: 999px;
    background: var(--gradient-electric);
    margin: 44px 0 0;
  }
  #legal {
    position: absolute;
    bottom: 360px;
    left: 0; right: 0;
    font-size: 20px;
    color: hsl(var(--foreground) / .38);
    text-align: center;
    z-index: 4;
  }
</style>
</head>
<body data-guides="0">

<div class="deck">
  <div class="stage-wrap"><div class="stage" id="stage">

    <div class="guides">
      <div class="reels-top"></div><div class="reels-right"></div><div class="reels-bottom"></div>
    </div>

    <div class="core" id="core">
      <div class="punch">
        <div class="t-num" id="zero">0</div>
        <div class="t-num grad-text" id="big">0</div>
      </div>
      <div class="t-display" id="claim">
        <span class="reveal-line"><span>AND YOU'VE</span></span>
        <span class="reveal-line"><span class="neg">NEVER BEEN</span></span>
        <span class="reveal-line"><span class="neg">SCORED.</span></span>
      </div>
      <div class="t-display" id="mark">VAYLO SPORTS</div>
      <div id="rule"></div>
    </div>

    <div class="compliance" id="legal">VPR is calculated from metrics you log.</div>

  </div></div>
</div>

<div class="hud">
  <div class="hud-top">
    <span class="hud-title">Ad 2 — 6-SECOND STOP</span>
    <span class="hud-meta">6.0s · 9:16 1080×1920 · interruption bumper · one number, no UI</span>
    <span class="hud-note">Retargeting + paid social. Cut on the beat.</span>
  </div>
  <div class="transport">
    <button class="tb" id="play">▶  Play</button>
    <button class="tb" id="restart">↺</button>
    <button class="tb" id="loop" aria-pressed="true">Loop</button>
    <button class="tb" id="guides" aria-pressed="false">Guides</button>
    <button class="tb" id="clean">Clean</button>
    <div class="scrub"><input type="range" id="scrub" value="0" /><div class="beats"></div></div>
    <span class="tc" id="tc">00:00.00 / 00:06.00</span>
  </div>
</div>

<script src="core.js"></script>
<script>
const $ = (s) => document.querySelector(s);
const stage = $('#stage');
const ad = new VayloAd({ stage, duration: 6, title: 'Ad 2 — 6-SECOND STOP' });
window.ad = ad;

[[0, 'BLACK'], [0.45, 'COUNT'], [1.45, 'PUNCH'], [2.1, 'CLAIM'], [3.9, 'MARK']].forEach(([t, l]) => ad.beat(t, l));

const big = $('#big'), zero = $('#zero'), claim = $('#claim'), mark = $('#mark'), rule = $('#rule'), legal = $('#legal');
const core = $('#core');

/* 0.00 — a single dead grey 0. This is the hook: the score you have. */
ad.add(zero, [{ offset: 0, opacity: 0, transform: 'scale(.7)' }, { offset: 1, opacity: 1, transform: 'scale(1)' }],
  { from: 0.10, to: 0.45, easing: 'cubic-bezier(.16,1,.3,1)' });
ad.add(zero, [{ offset: 0, opacity: 1 }, { offset: 1, opacity: 0, filter: 'blur(0px)' }, { offset: 1, opacity: 0, filter: 'blur(18px)' }],
  { from: 0.45, to: 0.75 });

/* 0.45 — the counter races. Fast, expo, lands hard. */
ad.count(big, 0.45, 1.45, 0, 62, { prefix: '' });
ad.add(big, [{ offset: 0, opacity: 0, transform: 'scale(1.3)', filter: 'blur(20px)' }, { offset: 1, opacity: 1, transform: 'scale(1)', filter: 'blur(0)' }],
  { from: 0.45, to: 0.70, easing: 'cubic-bezier(.2,.9,.25,1)' });

/* 1.45 — the punch. Overshoot then settle; the glow blooms on the landing. */
ad.add(big, [
  { offset: 0, transform: 'scale(1)' },
  { offset: .55, transform: 'scale(1.16)' },
  { offset: .78, transform: 'scale(.965)' },
  { offset: 1, transform: 'scale(1)' }
], { from: 1.45, to: 1.95, easing: 'linear' });
ad.add($('.punch'), [
  { offset: 0, transform: 'scale(.55)', opacity: .2 },
  { offset: 1, transform: 'scale(1.25)', opacity: .85 }
], { from: 1.45, to: 2.25, easing: 'cubic-bezier(.2,.8,.2,1)' });
ad.add($('.punch'), [
  { offset: 0, transform: 'scale(1.25)', opacity: .85 },
  { offset: 1, transform: 'scale(1.7)', opacity: 0 }
], { from: 2.25, to: 3.1, easing: 'ease-out' });

/* the number steps aside for the line that carries the whole ad */
ad.add(big, [
  { offset: 0, transform: 'translateY(0) scale(1)', opacity: 1 },
  { offset: 1, transform: 'translateY(-90px) scale(.86)', opacity: 0 }
], { from: 2.05, to: 2.55, easing: 'cubic-bezier(.7,0,.2,1)' });

/* 2.10 — the claim, line by line, on the beat */
[['nth-child(1)', 2.10], ['nth-child(2)', 2.26], ['nth-child(3)', 2.42]].forEach(([sel, t]) => {
  ad.add($(`#claim .reveal-line:${sel} > span`), [
    { offset: 0, opacity: 0, transform: 'translate3d(0,54px,0)', filter: 'blur(12px)' },
    { offset: 1, opacity: 1, transform: 'translate3d(0,0,0)', filter: 'blur(0)' }
  ], { from: t, to: t + 0.52, easing: 'cubic-bezier(.16,1,.3,1)' });
});
/* the container needs no hold cue — its three lines animate in on their own
   and the exit below takes the whole claim out at the cut */
ad.add(claim, [
  { offset: 0, opacity: 1, transform: 'scale(1)' },
  { offset: 1, opacity: 0, transform: 'scale(.94)' }
], { from: 3.85, to: 4.25, easing: 'cubic-bezier(.7,0,.2,1)' });

/* 3.90 — wordmark. No CTA button: a bumper sells the name, not the tap. */
ad.add(mark, [
  { offset: 0, opacity: 0, transform: 'translate3d(0,26px,0)' },
  { offset: 1, opacity: 1, transform: 'translate3d(0,0,0)' }
], { from: 3.90, to: 4.40, easing: 'cubic-bezier(.16,1,.3,1)' });
ad.add(rule, [
  { offset: 0, transform: 'scaleX(0)' },
  { offset: 1, transform: 'scaleX(1)' }
], { from: 4.35, to: 4.85, easing: 'cubic-bezier(.2,.9,.25,1)' });
ad.add(legal, [{ offset: 0, opacity: 0 }, { offset: 1, opacity: 1 }], { from: 4.9, to: 5.3 });

/* hold the end card through the loop point */
ad.add(core, [{ offset: 0, opacity: 1 }, { offset: 1, opacity: 1 }], { from: 4.4, to: 6 });
ad.add(legal, [{ offset: 0, opacity: 1 }, { offset: 1, opacity: 1 }], { from: 5.3, to: 6 });

mountPlayer(ad);
</script>
</body>
</html>
